name: Lean build
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
      - name: Print axioms of the main theorems
        run: |
          cat > axioms_check.lean <<'LEAN'
          import ErdosLean
          #print axioms Erdos996.erdos_996
          #print axioms Erdos1199.erdos_1199
          #print axioms Erdos1199.erdos_1199_pos
          #print axioms Erdos1199.erdos_1199_fc
          #print axioms Erdos612.erdos_612
          #print axioms Erdos612.erdos_612_false
          #print axioms Erdos514.erdos_514
          #print axioms Erdos956.erdos956
          #print axioms Erdos956.erdos956_main
          #print axioms Erdos956.erdos956_lowerBound
          LEAN
          lake env lean axioms_check.lean | tee axioms.txt
          test "$(grep -c "depends on axioms: \[propext, Classical.choice, Quot.sound\]" axioms.txt)" -eq 10
          ! grep -q sorryAx axioms.txt
