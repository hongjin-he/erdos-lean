  theorems:
    - Erdos956.erdos956
    - Erdos956.erdos956_main
  file: ErdosLean/Erdos956/Main.lean
  answer: "yes"
  scope: >-
    Lower bound h(n) >> n^{4/3}, hence h(n) > n^{1+c} for every c < 1/3 and all large n
    (the question as posed). The Erdős–Pach upper bound h(n) << n^{4/3} is stated as a
    hypothesis only (erdos956_theta_of_upper) and is not formalized.
